<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jobzen-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <title>JobZen — Student Project Request Platform</title>
    <meta name="description" content="Submit your project ideas, schedule meetings with supervisors, and track approvals in real time. JobZen is the fastest way for students to get their projects approved." />
    <meta name="keywords" content="student project, project submission, project approval, project request platform, college project, JobZen" />
    <meta name="author" content="JobZen" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hire.jobzen.co.in" />

    <!-- Open Graph (for WhatsApp / LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hire.jobzen.co.in" />
    <meta property="og:title" content="JobZen — Student Project Request Platform" />
    <meta property="og:description" content="Submit project ideas, schedule meetings, track approvals in real time. Built for students and supervisors." />
    <meta property="og:image" content="/images/og-image.png" />
    <meta property="og:site_name" content="JobZen" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobZen — Student Project Request Platform" />
    <meta name="twitter:description" content="Submit project ideas, schedule meetings, track approvals in real time." />

    <!-- Performance: preconnect to font servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts: load with display=swap so text shows immediately, even before fonts arrive -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme color for Android Chrome status bar -->
    <meta name="theme-color" content="#09090B" />
    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/jobzen-favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
